# docker-compose.yml
# ─────────────────────────────────────────────────────────
# Local dev services.
# Supabase itself runs via `supabase start` (its own Docker stack).
# This file is for the FastAPI backend only.
#
# Usage:
#   docker-compose up --build
# ─────────────────────────────────────────────────────────

version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env.local
    environment:
      - APP_ENV=development
    volumes:
      - ./services:/app/services:ro
    depends_on: []
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
